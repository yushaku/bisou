name: Deploy production

on:
  push:
    branches: [main]
    # A push that only touches Markdown or docs/ ships nothing: skip the deploy.
    # A push with any other file still deploys; run it by hand with workflow_dispatch if needed.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://bisou.levanson180200.workers.dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Check pending migrations
        run: pnpm check:migrations
      - name: Apply migrations
        run: pnpm exec wrangler d1 migrations apply bisou --remote --config wrangler.jsonc
      - name: Deploy built Worker
        run: pnpm exec wrangler deploy --config dist/bisou/wrangler.json
      - id: smoke
        name: Smoke test production
        run: |
          set -euo pipefail
          code=""
          for _ in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/api/me" || true)
            [ "$code" = "401" ] && break
            sleep 5
          done
          if [ "$code" != "401" ]; then
            echo "GET /api/me answered '${code}', expected 401"
            exit 1
          fi
          home=$(curl -sS -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/")
          if [ "$home" != "200" ]; then
            echo "GET / answered '${home}', expected 200"
            exit 1
          fi
          echo "Production answered: /api/me 401, / 200"
      - name: Roll back a release that failed its smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        run: pnpm exec wrangler rollback --yes --message "smoke test failed" --config dist/bisou/wrangler.json
